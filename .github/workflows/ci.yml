name: ManyWays CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Python API and worker contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - run: pip install -r services/api/requirements-test.txt
      - run: python -m pytest services/api/tests -q
  build-and-test:
    name: Production build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/manyways build
      - run: pnpm --filter @workspace/manyways test:unit
      - run: pnpm --filter @workspace/manyways exec playwright install --with-deps chromium
      - run: pnpm --filter @workspace/manyways test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: generated-artifacts/test-results
          retention-days: 7
