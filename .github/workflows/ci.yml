name: ManyWays CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Production build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5000
      # Deliberately fake, test-only configuration. Never authenticates a user.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS50ZXN0JA
      CLERK_SECRET_KEY: sk_test_ci_only_not_a_real_key
      CLERK_CI_PLACEHOLDER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/manyways test:unit
      - run: pnpm --filter @workspace/manyways build
      - run: pnpm --filter @workspace/manyways exec playwright install --with-deps chromium
      - run: pnpm --filter @workspace/manyways test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: generated-artifacts/test-results
          retention-days: 7
  python-tests:
    name: Python API and durable workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
