[project]
name = "manyways-api"
version = "0.1.0"
description = "ManyWays authenticated story API and durable agent worker"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langchain>=1.4.7",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.17",
    "mongomock>=4.3.0",
    "pyjwt[crypto]>=2.15.1",
    "pymongo>=4.19.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false
